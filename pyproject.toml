[project]
name = "tkHib"
version = "0.1.0"
description = "Default template for PDM package"
readme = "README.md"
requires-python = ">=3.9,<3.13"
authors = [
    {name = "onlyfeather", email = "1196477724@qq.com"},
]
dependencies = ["nonebot-adapter-onebot>=2.4.6", "nonebot-adapter-console>=0.9.0", "nonebot2[fastapi]>=2.4.4", "httpx>=0.24.0", "ddddocr==1.5.6", "nonebot-plugin-alconna>=0.59.4"]
license = {text = "MIT"}

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
    { name = "Console", module_name = "nonebot.adapters.console" }
]
plugins = []
plugin_dirs = ["tkhib/plugins"]
builtin_plugins = ["echo"]

[tool.pdm]
distribution = false
